<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hay un lugar que florece</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Pantalla inicial -->
    <section id="intro" class="scene active">
      <canvas id="starfield" aria-hidden="true"></canvas>
      <div class="intro-content">
        <h1 class="intro-title">Hay un lugar que florece cada vez que pienso en vos...</h1>
        <button id="enterBtn" class="btn-heart" aria-label="Entrar">Entrar ❤️</button>
      </div>
    </section>

    <!-- Escena principal -->
    <main id="stage" class="scene" aria-hidden="true">
      <div id="sky" class="sky">
        <svg id="sunset" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="skyGradient" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#0b1020" id="gradTop" />
              <stop offset="60%" stop-color="#07111e" id="gradMid" />
              <stop offset="100%" stop-color="#02030a" id="gradBottom" />
            </linearGradient>
          </defs>
          <rect width="100" height="100" fill="url(#skyGradient)"></rect>
        </svg>
        <canvas id="ambientParticles" aria-hidden="true"></canvas>
      </div>

      <div id="sceneContent" class="scene-content">
        <svg id="world" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMax slice" class="world-svg">
          <!-- Ground -->
          <rect x="0" y="600" width="1000" height="200" fill="#10210f"></rect>
          <!-- Tree group (paths and flowers inserted by JS) -->
          <g id="treeGroup" transform="translate(500,680)"></g>
          <!-- butterflies & petals layers -->
          <g id="butterflies"></g>
          <g id="petals"></g>
          <g id="sparkles"></g>
        </svg>

        <!-- UI overlay -->
        <aside class="ui">
          <div id="counterCard" class="card hidden">
            <div class="counter-title">Estamos juntos desde...</div>
            <div id="counter" class="counter">
              <div><span id="months">0</span><small>meses</small></div>
              <div><span id="days">0</span><small>días</small></div>
              <div><span id="hours">0</span><small>horas</small></div>
              <div><span id="minutes">0</span><small>minutos</small></div>
              <div><span id="seconds">0</span><small>segundos</small></div>
            </div>
          </div>

          <div id="letterCard" class="card hidden">
            <div class="letter-header">
              <strong>Carta</strong>
              <button id="editLetter" class="tiny">Editar</button>
            </div>
            <div id="letter" class="letter"></div>
          </div>
        </aside>

        <!-- Final phrase -->
        <div id="finalPhrase" class="final hidden">
          Si pudiera volver al 4 de abril de... volvería a elegirte una y mil veces.
        </div>
      </div>
    </main>

    <!-- Hidden audio control for user gesture / accessibility -->
    <div id="controls" aria-hidden="true"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
